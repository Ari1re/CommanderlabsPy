[package]
name = "commander-lab"
version = "0.21.0"
edition = "2021"

[dependencies]
chrono = "0.4"
urlencoding = "2"
flate2 = "1"
anyhow = "1"
crossterm = "0.29"
image = "0.25.6"
open = "5"
rand = "0.9"
ratatui = "0.30.1"
ratatui-image = { version = "11.0.6", default-features = false, features = ["image-defaults", "crossterm"] }
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

# arboard has no Android backend; src/clipboard.rs provides a fallback there.
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3"

[profile.release]
strip = true
