name: Build Commander Lab

# Every push builds Windows, Linux and Android and publishes a GitHub release
# (pushes to main and version tags). Pull requests build and test only.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      app_version: ${{ steps.v.outputs.app_version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          base=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          major_minor=$(echo "$base" | cut -d. -f1-2)
          # Patch = run number so every Android build installs over the last.
          app_version="${major_minor}.${{ github.run_number }}"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "version=$app_version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  test:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: frontend/dist }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p commander-lab-core -p commander-lab-web

  # Static browser edition: runs on any Linux (NixOS included) with no deps.
  web-linux:
    needs: [frontend, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: frontend/dist }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - uses: Swatinem/rust-cache@v2
        with: { key: musl }
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p commander-lab-web --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: web-linux
          path: target/x86_64-unknown-linux-musl/release/commander-lab-web

  desktop:
    needs: [meta, frontend, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: frontend/dist }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: desktop }
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev
      - name: Set app version
        shell: bash
        run: |
          node -e "const f='desktop/src-tauri/tauri.conf.json';const c=require('./'+f);c.version='${{ needs.meta.outputs.app_version }}';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - run: npm ci
        working-directory: desktop
      - name: Build app
        shell: bash
        working-directory: desktop
        run: |
          set -o pipefail
          npm run tauri -- build ${{ runner.os == 'Linux' && '--bundles appimage,deb' || '--bundles nsis' }} 2>&1 | tee build.log || {
            echo "::error title=Desktop build failed::$(grep -iE 'error|failed|cannot|could not' build.log | tail -n 40 | tr '\n' '|' | cut -c1-3500)"; exit 1; }
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/commander-lab.exe dist/CommanderLab-windows-x86_64-portable.exe
            cp target/release/bundle/nsis/*.exe dist/CommanderLab-windows-x86_64-setup.exe
          else
            cp target/release/bundle/appimage/*.AppImage dist/CommanderLab-linux-x86_64.AppImage
            cp target/release/bundle/deb/*.deb dist/CommanderLab-linux-amd64.deb
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist/*

  linux-installer:
    needs: [meta, desktop, web-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: desktop-linux, path: in }
      - uses: actions/download-artifact@v4
        with: { name: web-linux, path: in }
      - name: Build self-installing .sh
        run: |
          mkdir -p app dist
          cp in/CommanderLab-linux-x86_64.AppImage app/CommanderLab.AppImage
          cp in/commander-lab-web app/commander-lab-web
          cp packaging/commander-lab.sh app/
          chmod +x app/*
          tar -C app -czf payload.tar.gz .
          sed "s/__CL_VERSION__/${{ needs.meta.outputs.version }}/" packaging/selfextract-header.sh > dist/CommanderLab-linux-x86_64.sh
          cat payload.tar.gz >> dist/CommanderLab-linux-x86_64.sh
          chmod +x dist/CommanderLab-linux-x86_64.sh
          cp in/commander-lab-web dist/CommanderLab-web-linux-x86_64
      - name: Smoke-test installer and browser edition
        run: |
          export COMMANDER_LAB_HOME="$RUNNER_TEMP/cl"
          sh dist/CommanderLab-linux-x86_64.sh --extract
          test -x "$COMMANDER_LAB_HOME/app/CommanderLab.AppImage"
          "$COMMANDER_LAB_HOME/app/commander-lab-web" --no-browser --port 7999 &
          sleep 3
          curl -sf http://127.0.0.1:7999/health
          curl -sf -X POST http://127.0.0.1:7999/api/status -d '{}' -H 'content-type: application/json'
          curl -sf http://127.0.0.1:7999/ | grep -q '<div id="app">'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: dist/*

  android:
    needs: [meta, frontend, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: frontend/dist }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { key: android }
      - name: Locate Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          [ -d "$NDK" ] || NDK=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
            NDK="$SDK/ndk/27.2.12479018"
          fi
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
          echo "Using NDK $NDK and build-tools $BT"
      - name: Set app version
        run: |
          node -e "const f='desktop/src-tauri/tauri.conf.json';const c=require('./'+f);c.version='${{ needs.meta.outputs.app_version }}';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - run: npm ci
        working-directory: desktop
      - name: Generate Android project
        working-directory: desktop
        run: |
          npm run tauri -- android init --ci
          # Camera access for scanning deck QR codes.
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$MANIFEST" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' "$MANIFEST"
      - name: Build APK
        working-directory: desktop
        run: |
          set -o pipefail
          npm run tauri -- android build --apk --target aarch64 armv7 x86_64 --ci 2>&1 | tee build.log || {
            echo "::error title=Android build failed::$(grep -iE 'error|failed|cannot|could not|exception' build.log | tail -n 40 | tr '\n' '|' | cut -c1-3500)"; exit 1; }
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS=desktop/commanderlab-ci.keystore
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"; KS="$RUNNER_TEMP/release.keystore"; fi
          APK=$(ls desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          mkdir -p dist
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$KS" \
            --ks-pass "pass:${KS_PASS:-commanderlab}" \
            --ks-key-alias "${KEY_ALIAS:-commanderlab}" \
            --key-pass "pass:${KEY_PASS:-commanderlab}" \
            --out dist/CommanderLab-android.apk aligned.apk
          "$BUILD_TOOLS/apksigner" verify dist/CommanderLab-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/CommanderLab-android.apk

  release:
    if: needs.meta.outputs.release == 'true'
    needs: [meta, desktop, linux-installer, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Gather files
        run: |
          mkdir dist
          cp dl/desktop-windows/* dl/linux-installer/* dl/android/* dist/
          cp dl/desktop-linux/*.AppImage dl/desktop-linux/*.deb dist/
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Commander Lab ${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: true
          body: |
            Automated build of `${{ github.sha }}`.

            | Platform | Download |
            |---|---|
            | Windows 10/11 | `CommanderLab-windows-x86_64-setup.exe` (installer) or `CommanderLab-windows-x86_64-portable.exe` |
            | Linux, any distro incl. NixOS | `CommanderLab-linux-x86_64.sh` → `sh CommanderLab-linux-x86_64.sh` |
            | Linux packages | `.AppImage`, `.deb`, or `CommanderLab-web-linux-x86_64` (browser edition) |
            | Android 7+ | `CommanderLab-android.apk` |
          files: dist/*
