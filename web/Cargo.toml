[package]
name = "commander-lab-web"
version.workspace = true
edition = "2021"
description = "Commander Lab in your browser: serves the app UI and API locally"

[[bin]]
name = "commander-lab-web"
path = "src/main.rs"

[dependencies]
commander-lab-core = { path = "../core" }
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rust-embed = { version = "8", features = ["mime-guess"] }
serde_json = "1"
open = "5"
