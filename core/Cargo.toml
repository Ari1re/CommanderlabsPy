[package]
name = "commander-lab-core"
version.workspace = true
edition = "2021"
description = "Commander Lab deck engine: generation, analysis, combos, MPC, exports"

[lib]
name = "commander_lab_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
flate2 = "1"
rand = "0.9"
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Built-in AI engine (llama.cpp compiled in). Off by default because it needs
# a C++ toolchain and CMake; the desktop/Android app turns it on.
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["common", "android-static-stdcxx"], optional = true }
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }

[features]
local-llm = ["dep:llama-cpp-2"]
