[package]
name = "commander-lab-core"
version.workspace = true
edition = "2021"
description = "Commander Lab deck engine: generation, analysis, combos, MPC, exports"

[lib]
name = "commander_lab_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
flate2 = "1"
rand = "0.9"
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
