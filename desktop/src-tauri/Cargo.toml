[package]
name = "commander-lab"
version.workspace = true
edition = "2021"
description = "Commander Lab desktop and Android app"

[lib]
name = "commander_lab_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "commander-lab"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
commander-lab-core = { path = "../../core" }
tauri = { version = "2", features = [] }
serde_json = "1"
